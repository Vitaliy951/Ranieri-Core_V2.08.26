apiVersion: apps/v1
kind: Deployment
metadata:
  name: ranieri-api-staging
  namespace: ranieri-staging
  labels:
    app: ranieri-api-staging
    environment: staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ranieri-api-staging
  template:
    metadata:
      labels:
        app: ranieri-api-staging
        environment: staging
    spec:
      containers:
      - name: ranieri-api          # имя контейнера (используется в пайплайне)
        image: cr.yandex/ranieri-registry/ranieri-core:latest
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: ranieri-config-staging
        - secretRef:
            name: ranieri-secrets-staging
        resources:
          requests:
            cpu: "200m"
            memory: "512Mi"
          limits:
            cpu: "1000m"
            memory: "2Gi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
      imagePullSecrets:
      - name: yandex-registry-secret
