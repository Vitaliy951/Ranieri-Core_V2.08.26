apiVersion: apps/v1
kind: Deployment
metadata:
  name: ranieri-api
  namespace: ranieri-prod
  labels:
    app: ranieri-api
    environment: production
spec:
  replicas: 3
  selector:
    matchLabels:
      app: ranieri-api
  template:
    metadata:
      labels:
        app: ranieri-api
        environment: production
    spec:
      containers:
      - name: ranieri-api          # имя контейнера используется в пайплайне
        image: cr.yandex/ranieri-registry/ranieri-core:latest
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: ranieri-config
        - secretRef:
            name: ranieri-secrets
        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "2000m"
            memory: "4Gi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
      imagePullSecrets:
      - name: yandex-registry-secret   # если требуется для доступа к приватному registry
